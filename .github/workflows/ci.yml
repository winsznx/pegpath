name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:integration
        continue-on-error: true # depends on the public Mezo testnet RPC

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      # contracts/lib is not committed; fetch forge-std at the version the tests were written against.
      - run: forge install foundry-rs/forge-std@v1.17.0 --no-git
      - run: forge build
      # The only tests are fork tests against Mezo Testnet (oracle precompile stubbed); they need
      # MEZO_PRICE and ~10 minutes of public RPC, so CI builds the contracts and leaves them to local runs.
